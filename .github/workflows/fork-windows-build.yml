name: AnyPS5 fork Windows build

on:
  push:
    branches:
      - fix/windows-host-import-rewatch-cut
      - fix/graphics-memory-compared-shared-depth
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
  WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release
    -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  binaries:
    name: Windows relinker and PRX libraries
    if: github.repository == 'donlums/AnyPS5'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out fork and pinned dependencies
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Configure Git for Windows certificate bundle
        run: |
          for prefix in ucrt64 mingw64; do
            bundle="C:/Program Files/Git/$prefix/etc/ssl/certs/ca-bundle.crt"
            if [ -f "$bundle" ]; then
              echo "SSL_CERT_FILE=$bundle" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Git for Windows CA bundle not found"
          exit 1

      - name: Restore WinLibs compiler
        id: compiler-cache
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ runner.os }}-${{ env.WINLIBS_ZIP }}

      - name: Download WinLibs if uncached
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" \
            "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs

      - name: Activate WinLibs compiler
        run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"

      - name: Enable compiler object caching
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: fork-windows-binaries
          save: true

      - name: Configure production build without test-suite targets
        shell: cmd
        run: cmake -S . -B build %CONFIGURE% -DBUILD_TESTING=OFF

      - name: Build Windows relinker and all patched libraries
        shell: cmd
        run: cmake --build build --target relinker libs --parallel 4

      - name: Package Windows executable and PRX libraries
        shell: cmd
        run: python tools/package_release.py --platform windows --build build --output dist --version "v0.1.3-fork-${{ github.run_number }}"

      - name: Upload compiled Windows files
        uses: actions/upload-artifact@v7
        with:
          name: AnyPS5-Windows-${{ github.run_number }}
          path: |
            dist/relinker-*.exe
            dist/prx-windows-*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  memory-regression:
    name: Windows AGC memory regression compilation
    if: github.repository == 'donlums/AnyPS5'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out fork and pinned dependencies
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Configure Git for Windows certificate bundle
        run: |
          for prefix in ucrt64 mingw64; do
            bundle="C:/Program Files/Git/$prefix/etc/ssl/certs/ca-bundle.crt"
            if [ -f "$bundle" ]; then
              echo "SSL_CERT_FILE=$bundle" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Git for Windows CA bundle not found"
          exit 1

      - name: Restore WinLibs compiler
        id: compiler-cache
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ runner.os }}-${{ env.WINLIBS_ZIP }}

      - name: Download WinLibs if uncached
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" \
            "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs

      - name: Activate WinLibs compiler
        run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"

      - name: Enable compiler object caching
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: fork-windows-memory-test
          save: true

      - name: Configure targeted regression-test build
        shell: cmd
        run: cmake -S . -B build %CONFIGURE% -DBUILD_TESTING=ON -DANYPS5_AGC_EXECUTION_TESTS=DepthComparedShared

      - name: Compile AGC libraries and graphics memory regression tests
        shell: cmd
        run: cmake --build build --target libs agc_driver_recorder_tests agc_driver_depth_compared_shared_tests --parallel 4

      - name: Run GPU regressions and record whether Vulkan is available
        shell: bash
        run: |
          set -o pipefail
          set +e
          ANYPS5_NO_SHADER_CACHE=1 ctest --test-dir build -R '^(agc_host_import_cut_lifetime|agc_driver_depth_compared_shared)
      - name: Upload Windows regression logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AnyPS5-Windows-Regression-${{ github.run_number }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
          retention-days: 14

 -V --timeout 120 --no-tests=error 2>&1 | tee gpu-tests.log
          test_status=${PIPESTATUS[0]}
          set -e
          if grep -Eiq 'no usable Vulkan device|Vulkan result -9|Skipped' gpu-tests.log; then
            echo "::warning::GPU execution not validated: GitHub Windows runner has no usable Vulkan device"
            echo '### GPU execution: NOT VALIDATED (no Vulkan device)' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$test_status" -ne 0 ]; then
            echo '### GPU execution: FAILED (see test logs)' >> "$GITHUB_STEP_SUMMARY"
            exit "$test_status"
          else
            echo '### GPU execution: PASSED' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Windows regression logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AnyPS5-Windows-Regression-${{ github.run_number }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
          retention-days: 14

