name: AnyPS5 fork Windows build

on:
  push:
    branches:
      - fix/windows-host-import-rewatch-cut
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.repository == 'donlums/AnyPS5'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
      CONFIGURE: >-
        -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
        -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
    steps:
      - name: Check out our fork, including pinned submodules
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set the Git for Windows certificate bundle
        run: |
          for prefix in ucrt64 mingw64; do
            bundle="C:/Program Files/Git/$prefix/etc/ssl/certs/ca-bundle.crt"
            if [ -f "$bundle" ]; then
              echo "SSL_CERT_FILE=$bundle" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Git for Windows CA bundle not found"
          exit 1

      - name: Cache supported WinLibs compiler
        id: compiler-cache
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ runner.os }}-${{ env.WINLIBS_ZIP }}

      - name: Download WinLibs if not cached
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" \
            "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs

      - name: Activate WinLibs compiler
        run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"

      - name: Configure the full Windows build
        shell: cmd
        run: cmake -S . -B build %CONFIGURE%

      - name: Compile AnyPS5 relinker, tests and libraries
        shell: cmd
        run: cmake --build build --parallel 2

      - name: Explicitly build all patched PRX libraries
        shell: cmd
        run: cmake --build build --target libs --parallel 2

      - name: Test the Windows host import cut regression
        id: regression
        continue-on-error: true
        shell: cmd
        run: ctest --test-dir build -R "^agc_host_import_cut_lifetime$" -V --timeout 120 --no-tests=error

      - name: Package the Windows executable and PRX libraries
        shell: cmd
        run: python tools/package_release.py --platform windows --build build --output dist --version "v0.1.3-fork-${{ github.run_number }}"

      - name: Upload binaries and regression test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: AnyPS5-Windows-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/*.exe
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
